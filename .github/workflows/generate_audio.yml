name: Generate AI Audio (Per Test / Section)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Test Model ID(s) (e.g. "all", "eva1", or multiple: "eva1, petra, sophie")'
        required: true
        default: 'all'
        type: string
      section:
        description: 'Test Section / Module filter'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hoerverstehen
          - leseverstehen
          - sprachbausteine
      voice:
        description: 'OpenAI TTS Voice'
        required: true
        default: 'alloy'
        type: choice
        options:
          - alloy
          - nova
          - echo
          - fable
          - onyx
          - shimmer
      tts_model:
        description: 'OpenAI TTS Quality Model'
        required: true
        default: 'tts-1'
        type: choice
        options:
          - tts-1
          - tts-1-hd
      overwrite:
        description: 'Force overwrite / regenerate existing audio files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover Available Test Models in data/
        run: |
          python3 scripts/generate_ai_audio.py --list-models

      - name: Run Audio Generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi
          
          python3 scripts/generate_ai_audio.py \
            --model "${{ inputs.model }}" \
            --section "${{ inputs.section }}" \
            --voice "${{ inputs.voice }}" \
            --tts-model "${{ inputs.tts_model }}" \
            $OVERWRITE_FLAG

      - name: Commit and Push Generated Audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add audio/ data/manifest_models.json
          
          if git diff --staged --quiet; then
            echo "No new audio files or manifest changes to commit."
          else
            git commit -m "Generate AI audio for model '${{ inputs.model }}' (section: ${{ inputs.section }}) [skip ci]"
            git push
          fi
