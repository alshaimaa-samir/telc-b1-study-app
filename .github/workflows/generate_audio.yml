name: Generate AI Audio (OpenAI TTS)

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'OpenAI TTS Voice'
        required: true
        default: 'alloy'
        type: choice
        options:
          - alloy
          - onyx
          - nova
          - echo
          - fable
          - shimmer
      overwrite:
        description: 'Overwrite already generated MP3 files (Leave unchecked to fast-resume and skip existing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate_audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AI Audio MP3s
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set! Please add it in Repo Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            EXTRA_FLAGS="--overwrite"
            echo "Running in OVERWRITE mode (will regenerate all files)."
          else
            echo "Running in RESUME mode (skipping already existing audio files)."
          fi
          
          python3 scripts/generate_ai_audio.py --voice ${{ github.event.inputs.voice }} $EXTRA_FLAGS

      - name: Commit and Push Audio Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --staged --quiet; then
            echo "No new audio files to commit."
          else
            git commit -m "feat(audio): batch generate audio MP3s [voice: ${{ github.event.inputs.voice }}, overwrite: ${{ github.event.inputs.overwrite }}]"
            git push
          fi
